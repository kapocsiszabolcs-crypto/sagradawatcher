name: sagrada-watch

on:
  schedule:
    - cron: "*/2 * * * *" # 10 percenként; a GitHub ütemezése késhet
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sagrada-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright telepítése
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Jegyek ellenőrzése
        run: python -u sagrada_watch_ci.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Hibakeresési fájlok feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            debug.png
            debug.html
          if-no-files-found: warn
          retention-days: 7
